openapi: 3.0.3
info:
  title: Library Borrowing Tracker API
  version: 1.0.0
  description: >-
    REST API for books, members, and loans. Each resource supports list,
    retrieve, create, replace, partial update, and delete operations.
servers:
  - url: https://YOUR_APIGEE_HOST/library
    description: Replace with the deployed Apigee proxy base path.
security:
  - apiKeyAuth: []
tags:
  - name: Books
  - name: Members
  - name: Loans
paths:
  /api/books:
    get:
      tags: [Books]
      summary: List books
      operationId: getBooks
      responses:
        "200":
          description: Books returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Books]
      summary: Create a book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Book created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/books/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Books]
      summary: Get a book by ID
      operationId: getBook
      responses:
        "200":
          description: Book returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Books]
      summary: Replace a book
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "204":
          description: Book updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Books]
      summary: Change one or more book fields
      operationId: patchBook
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/JsonPatch"
            example:
              - op: replace
                path: /isAvailable
                value: false
      responses:
        "204":
          description: Book patched.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Books]
      summary: Delete a book
      operationId: deleteBook
      responses:
        "204":
          description: Book deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/members:
    get:
      tags: [Members]
      summary: List members
      operationId: getMembers
      responses:
        "200":
          description: Members returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Members]
      summary: Create a member
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/members/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Members]
      summary: Get a member by ID
      operationId: getMember
      responses:
        "200":
          description: Member returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Members]
      summary: Replace a member
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "204":
          description: Member updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Members]
      summary: Change one or more member fields
      operationId: patchMember
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/JsonPatch"
            example:
              - op: replace
                path: /phoneNumber
                value: 555-0103
      responses:
        "204":
          description: Member patched.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Members]
      summary: Delete a member
      operationId: deleteMember
      responses:
        "204":
          description: Member deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/loans:
    get:
      tags: [Loans]
      summary: List loans
      operationId: getLoans
      responses:
        "200":
          description: Loans returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Loans]
      summary: Create a loan
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanCreate"
      responses:
        "201":
          description: Loan created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/loans/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Loans]
      summary: Get a loan by ID
      operationId: getLoan
      responses:
        "200":
          description: Loan returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Loans]
      summary: Replace a loan
      operationId: updateLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanUpdate"
      responses:
        "204":
          description: Loan updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Loans]
      summary: Change one or more loan fields
      operationId: patchLoan
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/JsonPatch"
            example:
              - op: replace
                path: /status
                value: Returned
      responses:
        "204":
          description: Loan patched.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Loans]
      summary: Delete a loan
      operationId: deleteLoan
      responses:
        "204":
          description: Loan deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-apikey
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Positive integer resource ID.
      schema:
        type: integer
        format: int32
        minimum: 1
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or unapproved API key.
    BadRequest:
      description: Request body or patch document is invalid.
    NotFound:
      description: Resource was not found.
  schemas:
    BookRead:
      type: object
      required: [id, title, author, category, isAvailable]
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        author:
          type: string
        category:
          type: string
        isAvailable:
          type: boolean
    BookCreate:
      type: object
      required: [title, author, category, isAvailable]
      properties:
        title:
          type: string
        author:
          type: string
        category:
          type: string
        isAvailable:
          type: boolean
          default: true
    BookUpdate:
      type: object
      properties:
        title:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        isAvailable:
          type: boolean
          nullable: true
    MemberRead:
      allOf:
        - $ref: "#/components/schemas/MemberCreate"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
    MemberCreate:
      type: object
      required: [fullName, email, phoneNumber]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
    MemberUpdate:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          nullable: true
    LoanRead:
      allOf:
        - $ref: "#/components/schemas/LoanUpdate"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
    LoanCreate:
      type: object
      required: [bookId, memberId, borrowDate, status]
      properties:
        bookId:
          type: integer
          format: int32
          minimum: 1
        memberId:
          type: integer
          format: int32
          minimum: 1
        borrowDate:
          type: string
          format: date-time
        status:
          type: string
          default: Active
    LoanUpdate:
      type: object
      required: [bookId, memberId, borrowDate, status]
      properties:
        bookId:
          type: integer
          format: int32
          minimum: 1
        memberId:
          type: integer
          format: int32
          minimum: 1
        borrowDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
    JsonPatch:
      type: array
      items:
        $ref: "#/components/schemas/JsonPatchOperation"
    JsonPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, move, copy, test]
        path:
          type: string
        from:
          type: string
          nullable: true
        value:
          nullable: true

